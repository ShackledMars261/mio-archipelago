name: Create Issue Branch
on:
    issues:
        types: [assigned, closed]
    # Required for the pull-request features: opening the draft PR, linking it
    # to the issue, and closing the issue when it merges.
    pull_request:
        types: [opened, closed]

permissions:
    contents: write      # create the branch
    issues: write        # comment on the issue
    pull-requests: write # open the draft PR

jobs:
    create_issue_branch:
        runs-on: ubuntu-latest
        steps:
            - name: Create Issue Branch
              uses: robvanderleek/create-issue-branch@main
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}