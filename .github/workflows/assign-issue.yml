name: Assign Issue

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/assign')
    steps:
      - name: Assign the commenter
        uses: takanome-dev/assign-issue-action@v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assigned_comment: "Issue has been assigned."